services:
  db:
    image: postgres:16-alpine
    container_name: uk_web_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: uk_web_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: uk_web_server
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres_password@db:5432/uk_web_db?schema=public"
      PORT: 5000
      SMSAERO_LOGIN: ${SMSAERO_LOGIN}
      SMSAERO_API_KEY: ${SMSAERO_API_KEY}
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: uk_web_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data: