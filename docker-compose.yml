services:
  db:
    image: postgres:16-alpine
    container_name: uk_web_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: uk_web_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .             # <-- Сборка идет из КОРНЯ проекта
      dockerfile: server/Dockerfile
    container_name: uk_web_server
    restart: always
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-5000}:5000"
    depends_on:
      - db

  client:
    build:
      context: .             # <-- Сборка идет из КОРНЯ проекта
      dockerfile: client/Dockerfile
    container_name: uk_web_client
    restart: always
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - server

volumes:
  postgres_data: