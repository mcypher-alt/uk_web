services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-5000}:5000"
    depends_on:
      - db

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: always
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - server

volumes:
  postgres_data: